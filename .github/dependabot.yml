version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # trailing version comment together. The cooldown delays adoption of new
  # releases so a compromised upstream release has time to be caught and
  # yanked before it lands here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
